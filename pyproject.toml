[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrascan-pipeline"
version = "0.1.0"
description = "Reproducible, provenance-first Earth observation trend analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pyproj>=3.6",
  "requests>=2.31",
  "scipy>=1.13,<2",
  "shapely>=2.1",
]

[project.optional-dependencies]
earthdata = ["earthaccess>=0.12", "xarray>=2024.1"]
test = ["httpx>=0.27", "jsonschema>=4.21", "pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
